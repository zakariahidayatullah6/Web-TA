<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegant Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 450px;
            backdrop-filter: blur(10px);
            transform: translateY(0);
            transition: all 0.5s ease;
        }

        .login-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
        }

        .login-container h2 {
            text-align: center;
            color: #1a1a1a;
            margin-bottom: 40px;
            font-size: 2.5em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .input-group {
            position: relative;
            margin-bottom: 35px;
        }

        .input-group input {
            width: 100%;
            padding: 18px 25px;
            border: 2px solid #e1e1e1;
            outline: none;
            background: #ffffff;
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.4s ease;
            color: #333;
        }

        .input-group input:focus {
            border-color: #764ba2;
            box-shadow: 0 0 15px rgba(118, 75, 162, 0.2);
        }

        .input-group label {
            position: absolute;
            left: 25px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            pointer-events: none;
            transition: all 0.4s ease;
            font-weight: 500;
        }

        .input-group input:focus ~ label,
        .input-group input:valid ~ label {
            top: -12px;
            left: 20px;
            font-size: 14px;
            background: white;
            padding: 0 10px;
            color: #764ba2;
            font-weight: 600;
        }

        .login-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.3);
        }

        .forgot-password {
            text-align: center;
            margin-top: 25px;
        }

        .forgot-password a {
            color: #764ba2;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .forgot-password a:hover {
            color: #667eea;
            text-decoration: underline;
        }

        /* Add animation effects */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-container {
            animation: fadeIn 1s ease;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Welcome</h2>
        <form action="login.php" method="POST">
            <div class="input-group">
                <input type="email" name="email" required>
                <label>Email Address</label>
            </div>
            <div class="input-group">
                <input type="password" name="password" required>
                <label>Password</label>
            </div>
            <button type="submit" class="login-btn">Sign In</button>
            <div class="forgot-password">
                <a href="#" class="message">Forgot Password?</a>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function(){
            // Enhanced animation for input labels
            $('.input-group input').on('focus', function() {
                $(this).siblings('label').addClass('active');
                $(this).parent('.input-group').addClass('focused');
            });
            
            $('.input-group input').on('blur', function() {
                if (!$(this).val()) {
                    $(this).siblings('label').removeClass('active');
                    $(this).parent('.input-group').removeClass('focused');
                }
            });

            // Auto-activate labels for filled inputs
            $('.input-group input').each(function() {
                if ($(this).val()) {
                    $(this).siblings('label').addClass('active');
                }
            });
        });
    </script>
</body>
</html>
